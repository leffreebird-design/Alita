<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nyx Core Terminal</title>
  <style>
    :root {
      --neon-cyan: #0ff;
      --neon-pink: #ff2a79;
      --neon-yellow: #f9f002;
      --bg-color: #050505;
    }

    body {
      margin: 0; padding: 0; 
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; height: 100vh;
      justify-content: center; align-items: center; text-align: center;
      overflow: hidden;
    }

    /* Effet scanlines écran cathodique */
    body::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06));
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      z-index: 999;
    }

    #status { 
      font-size: 1.1rem; 
      margin-bottom: 35px; 
      letter-spacing: 3px; 
      text-transform: uppercase;
      color: var(--neon-cyan);
      text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan);
      position: relative;
    }

    #micBtn {
      width: 150px; height: 150px; border-radius: 50%;
      background: rgba(0, 255, 255, 0.05);
      border: 2px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-size: 1.8rem; font-weight: bold; font-family: 'Courier New', Courier, monospace;
      cursor: pointer; transition: all 0.3s ease;
      outline: none; 
      box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 20px rgba(0, 255, 255, 0.2);
      text-shadow: 0 0 8px var(--neon-cyan);
      position: relative;
      z-index: 10;
    }
    #micBtn:active { transform: scale(0.95); }

    #micBtn.listening {
      background: rgba(255, 42, 121, 0.1);
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      box-shadow: 0 0 30px var(--neon-pink), inset 0 0 30px rgba(255, 42, 121, 0.4);
      text-shadow: 0 0 8px var(--neon-pink);
      animation: pulse-pink 1.5s infinite;
    }

    #micBtn.processing {
      background: rgba(249, 240, 2, 0.1);
      border-color: var(--neon-yellow);
      color: var(--neon-yellow);
      box-shadow: 0 0 25px var(--neon-yellow), inset 0 0 25px rgba(249, 240, 2, 0.4);
      text-shadow: 0 0 8px var(--neon-yellow);
      animation: rotate-border 1s linear infinite;
    }

    @keyframes pulse-pink {
      0% { box-shadow: 0 0 20px var(--neon-pink), inset 0 0 20px rgba(255,42,121,0.2); }
      50% { box-shadow: 0 0 50px var(--neon-pink), inset 0 0 40px rgba(255,42,121,0.6); }
      100% { box-shadow: 0 0 20px var(--neon-pink), inset 0 0 20px rgba(255,42,121,0.2); }
    }
    @keyframes rotate-border {
      0% { transform: scale(1); border-style: dashed; }
      50% { transform: scale(1.05); border-style: dotted; }
      100% { transform: scale(1); border-style: dashed; }
    }

    #log { 
      margin-top: 45px; 
      width: 85%; max-width: 500px;
      height: 140px; 
      overflow-y: auto; text-align: left;
      background: rgba(0, 20, 20, 0.7);
      border-left: 4px solid var(--neon-cyan);
      border-right: 1px solid rgba(0, 255, 255, 0.2);
      border-top: 1px solid rgba(0, 255, 255, 0.2);
      border-bottom: 1px solid rgba(0, 255, 255, 0.2);
      padding: 15px;
      font-size: 0.85rem; 
      color: #a3f7f7; 
      text-shadow: 0 0 2px var(--neon-cyan);
      position: relative;
      z-index: 10;
    }
    
    #log::-webkit-scrollbar { width: 5px; }
    #log::-webkit-scrollbar-track { background: #000; }
    #log::-webkit-scrollbar-thumb { background: var(--neon-cyan); }

    .role-doc { color: #fff; opacity: 0.7; margin-bottom: 6px; }
    .role-nyx { color: var(--neon-pink); font-weight: bold; text-shadow: 0 0 3px var(--neon-pink); margin-bottom: 6px; }
  </style>
</head>
<body>

  <div id="status">[ INITIALISATION CORE... ]</div>
  <button id="micBtn">NYX</button>
  <div id="log"></div>

  <!-- MOTEUR NEURAL WASM -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    // Autoriser le cache navigateur local (IndexedDB)
    env.allowLocalModels = false;

    const micBtn = document.getElementById('micBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    let synthesiseur = null;
    let audioCtx = null;
    let sourceAudioActive = null;

    function majStatut(texte) {
      statusDiv.innerText = texte;
    }

    // 1. Initialisation du modèle neural en tâche de fond
    async function chargerModeleNeural() {
      try {
        majStatut("[ CHARGEMENT MOTEUR NEURAL... ]");
        synthesiseur = await pipeline('text-to-speech', 'Xenova/mms-tts-fra', {
          quantized: true,
          progress_callback: (prog) => {
            if (prog.status === 'progress') {
              majStatut(`[ TÉLÉCHARGEMENT VOIX : ${Math.round(prog.progress)}% ]`);
            }
          }
        });
        majStatut("[ SYSTÈME PRÊT ]");
      } catch (err) {
        console.error("Échec initialisation WASM :", err);
        majStatut("[ ERREUR MOTEUR LOCAL ]");
      }
    }

    chargerModeleNeural();

    // 2. Synthèse locale et lecture Web Audio
    async function genererEtJouerAudio(texte) {
      if (!synthesiseur) {
        majStatut("[ MOTEUR EN COURS DE CHARGEMENT ]");
        micBtn.classList.remove('processing');
        return;
      }

      majStatut("[ SYNTHÈSE NEURONALE... ]");
      try {
        const sortie = await synthesiseur(texte);

        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        const buffer = audioCtx.createBuffer(1, sortie.audio.length, sortie.sampling_rate);
        buffer.copyToChannel(sortie.audio, 0);

        if (sourceAudioActive) {
          try { sourceAudioActive.stop(); } catch (e) {}
        }

        majStatut("[ TRANSMISSION NYX... ]");
        sourceAudioActive = audioCtx.createBufferSource();
        sourceAudioActive.buffer = buffer;
        sourceAudioActive.connect(audioCtx.destination);

        sourceAudioActive.onended = () => {
          majStatut("[ SYSTÈME PRÊT ]");
          micBtn.classList.remove('processing');
        };

        sourceAudioActive.start(0);
      } catch (err) {
        console.error("Erreur de synthèse audio :", err);
        majStatut("[ ERREUR SYNTHÈSE ]");
        micBtn.classList.remove('processing');
      }
    }

    // 3. Reconnaissance vocale du micro
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        majStatut("[ LIAISON AUDIO... ]");
        micBtn.classList.add('listening');
      };

      recognition.onresult = async (event) => {
        const texte = event.results[0][0].transcript;
        logDiv.innerHTML += `<div class="role-doc">> DOC : ${texte}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        
        majStatut("[ ANALYSE NYX... ]");
        micBtn.classList.remove('listening');
        micBtn.classList.add('processing');

        try {
          const res = await fetch('/api/voix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texte: texte })
          });
          const data = await res.json();
          
          logDiv.innerHTML += `<div class="role-nyx">> NYX : ${data.reponse}</div>`;
          logDiv.scrollTop = logDiv.scrollHeight;

          // Déclenchement de la voix locale autonome
          await genererEtJouerAudio(data.reponse);
        } catch (err) {
          majStatut("[ ERREUR RÉSEAU ]");
          micBtn.classList.remove('processing');
        }
      };

      recognition.onerror = () => {
        majStatut("[ DÉFAILLANCE MICRO ]");
        micBtn.classList.remove('listening', 'processing');
      };
      
      recognition.onend = () => {
        if (!micBtn.classList.contains('processing')) {
          majStatut("[ SYSTÈME PRÊT ]");
          micBtn.classList.remove('listening');
        }
      };
    } else {
      majStatut("[ MATÉRIEL NON RECONNU ]");
    }

    // 4. Déverrouillage audio Chrome Android
    micBtn.addEventListener('click', async () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      if (sourceAudioActive) {
        try { sourceAudioActive.stop(); } catch(e) {}
      }

      try { await navigator.wakeLock.request('screen'); } catch(e) {}
      if (recognition) recognition.start();
    });
  </script>
</body>
</html>
