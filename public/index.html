<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nyx Core</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #050505;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
      text-align: center;
      touch-action: manipulation;
    }

    #status {
      font-size: 1.1rem;
      margin-bottom: 25px;
      opacity: 0.8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #micBtn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #333;
      color: #fff;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #micBtn:active {
      transform: scale(0.96);
    }

    #micBtn.listening {
      background: #4a0000;
      border-color: #ff2222;
      box-shadow: 0 0 35px rgba(255, 34, 34, 0.5);
      animation: pulse 1.4s infinite;
    }

    #micBtn.speaking {
      background: #002b4d;
      border-color: #0088ff;
      box-shadow: 0 0 35px rgba(0, 136, 255, 0.5);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    #log {
      margin-top: 25px;
      width: 90%;
      max-width: 480px;
      height: 140px;
      font-size: 0.85rem;
      color: #aaa;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      padding: 10px;
      overflow-y: auto;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div id="status">SYSTÈME PRÊT</div>
  <button id="micBtn" type="button">NYX</button>
  <div id="log"></div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    let recognition = null;
    let isListening = false;
    let wakeLock = null;
    let wakeLockDemande = false;

    // Référence globale permanente pour bloquer le ramasse-miettes (Garbage Collector) Android
    window.currentUtterance = null;

    function log(expediteur, message) {
      logDiv.innerText += `[${expediteur}] ${message}\n`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Gestion de l'anti-veille écran
    async function activerAntiVeille() {
      if ('wakeLock' in navigator) {
        wakeLockDemande = true;
        if (!wakeLock) {
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
              wakeLock = null;
            });
          } catch (err) {
            console.warn("WakeLock non accordé :", err);
          }
        }
      }
    }

    // Réactivation automatique si l'utilisateur quitte puis revient sur l'onglet
    document.addEventListener('visibilitychange', async () => {
      if (wakeLockDemande && document.visibilityState === 'visible' && !wakeLock) {
        await activerAntiVeille();
      }
    });

    // Configuration de la reconnaissance vocale
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        statusDiv.innerText = "ÉCOUTE EN COURS...";
        micBtn.className = "listening";
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        log("Toi", transcript);
        statusDiv.innerText = "TRAITEMENT...";
        micBtn.className = "";
        
        await envoyerServeur(transcript);
      };

      recognition.onerror = (event) => {
        isListening = false;
        statusDiv.innerText = "ERREUR : " + event.error;
        micBtn.className = "";
      };

      recognition.onend = () => {
        isListening = false;
        if (!synth || !synth.speaking) {
          statusDiv.innerText = "EN ATTENTE";
          micBtn.className = "";
        }
      };
    } else {
      statusDiv.innerText = "VOCAL NON SUPPORTÉ";
      log("Système", "SpeechRecognition indisponible sur ce navigateur.");
    }

    // Synthèse vocale fiabilisée pour flux Média / Bluetooth
    function repondre(texte) {
      if (!synth) return;

      if (synth.speaking) {
        synth.cancel();
      }

      const utterance = new SpeechSynthesisUtterance(texte);
      utterance.lang = 'fr-FR';
      utterance.rate = 1.05;
      utterance.pitch = 0.95;

      // Recherche d'une voix française disponible
      const voix = synth.getVoices();
      const voixFr = voix.find(v => v.lang && v.lang.startsWith('fr'));
      if (voixFr) {
        utterance.voice = voixFr;
      }

      window.currentUtterance = utterance;

      utterance.onstart = () => {
        statusDiv.innerText = "NYX PARLE...";
        micBtn.className = "speaking";
        log("Nyx", texte);
      };

      utterance.onend = () => {
        window.currentUtterance = null;
        statusDiv.innerText = "EN ATTENTE";
        micBtn.className = "";
      };

      utterance.onerror = (e) => {
        window.currentUtterance = null;
        console.error("Erreur TTS :", e);
        statusDiv.innerText = "ERREUR TTS";
        micBtn.className = "";
      };

      synth.speak(utterance);
    }

    // Envoi de la requête au backend
    async function envoyerServeur(texteEntrant) {
      try {
        const res = await fetch('/api/voix', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ texte: texteEntrant })
        });

        if (!res.ok) {
          throw new Error("Code HTTP " + res.status);
        }

        const data = await res.json();
        repondre(data.reponse || "Aucune réponse renvoyée.");
      } catch (err) {
        console.warn("Backend inaccessible, mode secours local :", err);
        // Réponse locale de secours si l'API n'est pas encore montée
        repondre("Reçu : " + texteEntrant);
      }
    }

    // Gestion du clic sur le bouton central
    micBtn.addEventListener('click', async () => {
      await activerAntiVeille();

      if (synth && synth.speaking) {
        synth.cancel();
      }

      if (!recognition) {
        log("Système", "Reconnaissance vocale non opérationnelle.");
        return;
      }

      if (isListening) {
        recognition.stop();
        return;
      }

      try {
        recognition.start();
      } catch (err) {
        console.warn("Échec du démarrage de l'écoute :", err);
      }
    });

    // Chargement anticipé des voix pour Android Chrome
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = () => synth.getVoices();
    }
  </script>
</body>
</html>
